version: "3.8"

services:
  sfguild-scanner:
    image: dasaod/sf-guildscanner:latest
    container_name: sfguild-scanner
    ports:
      - "8085:8080"
    volumes:
      - ./data:/app/data
    environment:
      - RUST_LOG=info
      # true, wenn der Scanner hinter einem eigenen HTTPS-Reverse-Proxy steht
      - SFGS_TRUST_PROXY=false
    restart: unless-stopped